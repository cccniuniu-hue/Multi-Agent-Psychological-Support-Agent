name: Compile and syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile Java without starting services
        run: mvn --batch-mode --no-transfer-progress -DskipTests compile

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check tracked Python source syntax
        run: |
          python - <<'PY'
          import py_compile
          import subprocess

          output = subprocess.check_output(["git", "ls-files", "-z", "--", "*.py"])
          paths = [path for path in output.decode().split("\0") if path]
          for path in paths:
              py_compile.compile(path, doraise=True)
          print(f"Checked {len(paths)} Python files")
          PY
      - name: Check RAGAS tooling without models or optional dependencies
        run: |
          python -m unittest discover -s eval -p 'test_ragas_eval.py' -v
          python eval/run-ragas-eval.py --input eval/examples/rag-eval-report.synthetic.json --validate-only
